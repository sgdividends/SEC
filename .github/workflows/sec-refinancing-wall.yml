name: SEC Refinancing Wall Weekly Fetch

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas
      - run: python scripts/sec_refinancing_wall.py
      - name: Commit updated cache
        run: |
          git config user.name "sec-edgar-bot"
          git config user.email "actions@github.com"
          git add data/sec_edgar/
          git diff --staged --quiet || git commit -m "Weekly SEC refinancing-wall update"
          git push
